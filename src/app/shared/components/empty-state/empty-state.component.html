<div class="empty-state">
    <app-svg-icon
            class="icon"
            [name]="icon"
            size="48px"
            [ariaLabel]="title">
    </app-svg-icon>
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    @if (actionLabel) {
        <button class="btn-primary" (click)="action.emit()">
            {{ actionLabel }}
        </button>
    }
</div>
